name: Atualizar arte do perfil

on:
  schedule:
    - cron: "17 6 * * *" # Atualiza diariamente às 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Instalar Dependências
        run: pip install requests beautifulsoup4
        
      - name: Buscar Contribuições
        run: python scripts/fetch_contributions.py
        
      - name: Renderizar Heatmap
        run: python scripts/render_heatmap_svg.py
        
      - name: Auto-Commit no Repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"