  <text x="20" y="30" class="ascii-line" style="animation-delay: 0.00s;">&#160;┌─────────────────────────────────────────────────────────────────┐</text><text x="20" y="48" class="ascii-line" style="animation-delay: 0.15s;">&#160;│&#160;&gt;_&#160;WANDREL&#160;ALVES&#160;|&#160;SOFTWARE&#160;DEVELOPER&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;│</text><text x="20" y="66" class="ascii-line" style="animation-delay: 0.30s;">&#160;├─────────────────────────────────────────────────────────────────┤</text><text x="20" y="84" class="ascii-line" style="animation-delay: 0.45s;">&#160;│&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;│</text><text x="20" y="102" class="ascii-line" style="animation-delay: 0.60s;">&#160;│&#160;&#160;def&#160;code_the_future(coffee_cups,&#160;ideas):&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;│</text><text x="20" y="120" class="ascii-line" style="animation-delay: 0.75s;">&#160;│&#160;&#160;&#160;&#160;&#160;&#160;while&#160;coffee_cups&#160;&gt;&#160;0:&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;│</text><text x="20" y="138" class="ascii-line" style="animation-delay: 0.90s;">&#160;│&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;try:&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#